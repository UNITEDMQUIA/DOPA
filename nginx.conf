server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker para resolución dinámica del servicio backend
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Compresión Gzip para acelerar carga de CanvasKit / JS / fuentes de Flutter Web
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Endpoint ligero para healthcheck del contenedor frontend
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Reverse Proxy de endpoints API (/api/v1/*) hacia el contenedor backend FastAPI
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Soporte SPA para navegación de rutas de Flutter Web
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché estático para assets compilados
    location ~* \.(?:ico|css|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
