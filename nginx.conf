server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para acelerar carga de CanvasKit / JS / fuentes de Flutter Web
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Endpoint ligero para healthcheck del contenedor
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Soporte SPA para navegación de rutas de Flutter Web
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché estático para assets compilados
    location ~* \.(?:ico|css|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
